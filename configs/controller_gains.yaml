# Control gains and allocation configuration
controllers:
  single_quad:
    position_gains:
      kp: [3.0, 3.0, 6.0]
      kv: [2.5, 2.5, 4.0]
      ki: [0.2, 0.2, 0.5]
      i_limit: [1.0, 1.0, 2.0]
    attitude_gains:
      kr: [1.6, 1.6, 1.0]
      kw: [0.22, 0.22, 0.15]
      ki: [0.05, 0.05, 0.02]
      i_limit: [0.2, 0.2, 0.1]

  connected_quad:
    position_gains:
      kp: [3.0, 3.0, 6.0]
      kv: [2.5, 2.5, 4.0]
      ki: [0.2, 0.2, 0.5]
      i_limit: [1.5, 1.5, 3.0]
    attitude_gains:
      kr: [2.8, 2.8, 1.8]
      kw: [0.40, 0.40, 0.25]
      ki: [0.05, 0.05, 0.02]
      i_limit: [0.3, 0.3, 0.15]

  allocation:
    method: "qp_bounded" # or "weighted_pinv"
    regularization_weight: 1.0e-4
    slew_rate_penalty: 1.0e-3
    smooth_handover_time_s: 0.15 # bumpless blending duration
