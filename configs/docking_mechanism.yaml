# Docking mechanism specifications and latching criteria
docking:
  configuration: "side_by_side" # Q1 +Y (left) docks with Q2 -Y (right), body FLU.
  capture_model: "passive_contact_latch" # No magnetic attraction law is implemented.
  calibration_status: simulation_assumption
  contact_required: true
  connector_offset_q1: [0.0, 0.22, 0.0]  # Connector position in Q1 body frame (m)
  connector_offset_q2: [0.0, -0.22, 0.0] # Connector position in Q2 body frame (m)
  nominal_separation_at_dock: [0.0, 0.44, 0.0]

  latch_criteria:
    position_tolerance_m: 0.020      # 20 mm
    orientation_tolerance_rad: 0.08  # ~4.6 deg
    relative_linear_velocity_mps: 0.10 # 0.10 m/s
    relative_angular_velocity_radps: 0.20 # 0.20 rad/s
    dwell_time_s: 0.03               # must stay within tolerance for 30 ms

  capture_mechanism:
    enabled: true
    capture_distance_m: 0.006          # 6 mm capture distance envelope (cleanly rejects 30mm missed capture)
    capture_angle_rad: 0.15            # ~8.6 deg capture attitude envelope
    max_resultant_force_N: 6.0         # Static + dashpot resultant cap, NOT static attraction
    anchor_inset_m: 0.004              # Each tensile anchor is 4 mm behind its contact face
    stiffness_N_per_m: 140.0           # Max static tension = 140 * .006 = .84 N
    damping_Ns_per_m: 10.0             # Linear axial damping (Ns/m) for energy dissipation
    angular_damping_Nms_per_rad: 0.08  # Rotational damping (Nms/rad)
    filter_contact_on_lock: true       # Filter connector contact during weld to prevent constraint fighting
    contact_hold_duration_s: 0.040     # Contact confirmation hold window (40 ms)

  release:
    zero_preload_mode: true
    elastic_preload:
      enabled: false
      spring_stiffness_N_per_m: 60.0
      preload_deflection_m: 0.008    # ~0.48 N initial repulsion force
      damping_Ns_per_m: 2.0
      # A finite compressed spring acts at connector sites before AND after release.
      # Elastic energy is explicitly logged; no velocity reset or infinite force pulse.
